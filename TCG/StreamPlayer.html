<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D20TCG — Deck Editor &amp; Battle Simulator</title>
<style>
/* ==========================================================================
   DESIGN TOKENS
   -----------------------------------------------------------------------
   ⚠ PLACEHOLDER PALETTE. I could not scrape the live CSS off
   scarethevoices.github.io/D20/D20TCCreator.html — my web-fetch tool only
   pulls text content, not stylesheets, so these hex values are a
   reasonable stand-in, not a match to your creator page.
   Everything is centralized in this one :root block, so once you give me
   (or paste in yourself) the real hex codes from D20TCCreator.html, it's a
   ten-value swap and the whole app re-themes itself — no hunting through
   the file. See end of chat for what I need from you.
   ========================================================================== */
:root{
  --bg-900:#0e0e12;
  --bg-800:#15151b;
  --bg-700:#1c1c24;
  --panel:#17171e;
  --panel-raised:#1e1e27;
  --line:#33333f;
  --gold:#d4af5a;
  --gold-dim:#8a713a;
  --parchment:#ece7db;
  --ink:#e2e2e8;
  --ink-dim:#9797a6;
  --blue-deck:#4d8fd6;
  --blue-deck-dim:#274a6e;
  --purple-veil:#9b6bd6;
  --purple-veil-dim:#4a2f6e;
  --danger:#d16a5f;
  --good:#6fbf8b;

  /* Affinity accent colors — used on card borders, dots, and badges */
  --aff-fire:#e2572b;
  --aff-water:#3aa6d9;
  --aff-earth:#7a9a4a;
  --aff-air:#8fd0c9;
  --aff-aether:#e8c766;
  --aff-void:#8a5cd6;

  /* Card-type accent colors — used when a card has no affinity (Skill/Item) */
  --type-hero:#d4af5a;
  --type-support:#5a9bd4;
  --type-skill:#9b6bd6;
  --type-item:#c98a4a;

  --card-w:135px;
  --card-h:190px;      /* 135 x 190 == 1 : 1.4074, matches 960x1350 art */
  --card-w-sm:64px;
  --card-h-sm:90px;
  --radius:10px;
  --shadow:0 8px 24px rgba(0,0,0,0.5);
  font-size:16px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% -10%, rgba(212,175,90,0.06), transparent 40%),
    radial-gradient(circle at 100% 0%, rgba(77,143,214,0.05), transparent 45%),
    linear-gradient(180deg, var(--bg-900), var(--bg-800));
  color:var(--ink);
  font-family:'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
  min-height:100vh;
}
h1,h2,h3{font-family:'Palatino Linotype', 'Georgia', serif; letter-spacing:0.02em;}

/* ==========================================================================
   TOP NAVIGATION
   ========================================================================== */
#topbar{
  position:relative; z-index:2;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; background:linear-gradient(180deg, var(--bg-700), var(--bg-800));
  border-bottom:1px solid var(--line); box-shadow:var(--shadow);
}
#topbar .brand{display:flex; align-items:center; gap:10px;}
#topbar .brand .crest{
  width:34px; height:34px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold), var(--gold-dim));
  box-shadow:0 0 0 3px rgba(212,175,90,0.15);
}
#topbar h1{margin:0; font-size:1.25rem; color:var(--parchment);}
#topbar h1 span{color:var(--gold); font-style:italic;}
.nav-tabs{display:flex; gap:8px;}
.nav-tabs button{
  background:var(--panel); color:var(--ink-dim); border:1px solid var(--line);
  padding:9px 18px; border-radius:999px; cursor:pointer; font-size:0.9rem;
  font-weight:600; transition:all .15s ease;
}
.nav-tabs button.active{background:var(--gold); color:#241b06; border-color:var(--gold);}
.nav-tabs button:not(.active):hover{border-color:var(--gold-dim); color:var(--parchment);}

.screen{display:none; position:relative; z-index:1; padding:20px 24px 40px;}
.screen.active{display:block;}

/* Data-load status banner (fetch progress / CORS error guidance) */
#loadBanner{
  max-width:1400px; margin:0 auto 16px; padding:12px 16px; border-radius:8px;
  font-size:0.85rem; display:none; border:1px solid var(--line);
}
#loadBanner.info{display:block; background:rgba(212,175,90,0.08); color:var(--gold); border-color:var(--gold-dim);}
#loadBanner.error{display:block; background:rgba(209,106,95,0.1); color:#f0a89f; border-color:var(--danger);}
#loadBanner code{background:rgba(0,0,0,0.3); padding:1px 6px; border-radius:4px;}

/* ==========================================================================
   SCREEN 1 — DECK EDITOR
   ========================================================================== */
#deckEditorScreen .editor-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:22px;
  max-width:1400px; margin:0 auto;
}
@media (max-width:900px){ #deckEditorScreen .editor-grid{grid-template-columns:1fr;} }

.panel{
  background:linear-gradient(180deg, var(--panel-raised), var(--panel));
  border:1px solid var(--line); border-radius:14px; padding:18px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:520px;
}
.panel h2{margin:0 0 12px; font-size:1.05rem; color:var(--parchment); display:flex; align-items:center; justify-content:space-between;}
.panel h2 .count-pill{
  font-family:'Trebuchet MS',sans-serif; font-size:0.75rem; background:var(--bg-900);
  border:1px solid var(--line); color:var(--gold); padding:3px 10px; border-radius:999px;
}

#searchInput{
  width:100%; padding:10px 14px; margin-bottom:10px; border-radius:8px;
  border:1px solid var(--line); background:var(--bg-900); color:var(--ink);
  font-size:0.95rem; outline:none;
}
#searchInput:focus{border-color:var(--gold-dim);}

/* Card-type filter chips (All / Hero / Support / Skill / Item) */
.type-filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.type-filters button{
  background:var(--bg-900); color:var(--ink-dim); border:1px solid var(--line);
  padding:5px 12px; border-radius:999px; cursor:pointer; font-size:0.75rem; font-weight:700;
}
.type-filters button.active{background:var(--gold); color:#241b06; border-color:var(--gold);}

.scroll-list{overflow-y:auto; max-height:600px; display:flex; flex-direction:column; gap:8px; padding-right:4px;}
.scroll-list::-webkit-scrollbar{width:8px;}
.scroll-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

.db-row{
  display:flex; align-items:center; gap:12px; background:var(--bg-900);
  border:1px solid var(--line); border-radius:8px; padding:8px; transition:border-color .15s;
}
.db-row:hover{border-color:var(--gold-dim);}
.thumb-sm{
  width:var(--card-w-sm); height:var(--card-h-sm); object-fit:cover; border-radius:6px;
  border:2px solid var(--line); background:var(--bg-700); flex-shrink:0;
}
.db-row .meta{flex:1; min-width:0;}
.db-row .meta .name-row{display:flex; align-items:center; gap:6px;}
.db-row .meta .name{font-weight:600; color:var(--parchment); font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.db-row .meta .sub-line{font-size:0.7rem; color:var(--ink-dim); margin-top:2px;}
.db-row .meta .stat-line{font-size:0.7rem; color:var(--gold); margin-top:2px; font-weight:600;}

.type-badge{
  font-size:0.6rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
  padding:2px 7px; border-radius:5px; flex-shrink:0; color:#0c0c10;
}
.type-badge.hero{background:var(--type-hero);}
.type-badge.support{background:var(--type-support);}
.type-badge.skill{background:var(--type-skill); color:#f4eefe;}
.type-badge.item{background:var(--type-item);}

.affinity-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 4px currentColor;}
.affinity-dot.fire{background:var(--aff-fire); color:var(--aff-fire);}
.affinity-dot.water{background:var(--aff-water); color:var(--aff-water);}
.affinity-dot.earth{background:var(--aff-earth); color:var(--aff-earth);}
.affinity-dot.air{background:var(--aff-air); color:var(--aff-air);}
.affinity-dot.aether{background:var(--aff-aether); color:var(--aff-aether);}
.affinity-dot.void{background:var(--aff-void); color:var(--aff-void);}

.qty-badge{
  font-size:0.72rem; color:var(--gold); border:1px solid var(--gold-dim); border-radius:999px;
  padding:2px 8px; min-width:34px; text-align:center;
}
.add-btn{
  background:var(--gold); color:#241b06; border:none; border-radius:6px; width:30px; height:30px;
  font-size:1.1rem; font-weight:700; cursor:pointer; flex-shrink:0;
}
.add-btn:disabled{background:var(--line); color:var(--ink-dim); cursor:not-allowed;}

.deck-row{
  display:flex; align-items:center; gap:12px; background:var(--bg-900);
  border:1px solid var(--line); border-radius:8px; padding:8px;
}
.stepper{display:flex; align-items:center; gap:8px;}
.stepper button{
  width:26px; height:26px; border-radius:6px; border:1px solid var(--line);
  background:var(--bg-700); color:var(--parchment); cursor:pointer; font-weight:700;
}
.stepper button:hover{border-color:var(--gold-dim);}
.stepper .qty-num{width:20px; text-align:center; font-weight:700; color:var(--gold);}

.panel-footer{margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:14px;}
.deck-total{font-size:0.85rem; color:var(--ink-dim);}
.deck-total b{color:var(--parchment);}

.btn{
  border:none; border-radius:8px; padding:10px 18px; font-weight:700; cursor:pointer;
  font-size:0.9rem; transition:filter .15s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-gold{background:linear-gradient(180deg, var(--gold), var(--gold-dim)); color:#241b06;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-blue{background:linear-gradient(180deg, var(--blue-deck), var(--blue-deck-dim)); color:#eaf2ff;}
.btn-purple{background:linear-gradient(180deg, var(--purple-veil), var(--purple-veil-dim)); color:#f3ecff;}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink);}
.btn-outline:hover{border-color:var(--gold-dim); color:var(--parchment);}
.btn:disabled{opacity:.5; cursor:not-allowed;}

.empty-hint{color:var(--ink-dim); font-size:0.85rem; padding:20px; text-align:center; border:1px dashed var(--line); border-radius:8px;}

/* ==========================================================================
   SCREEN 2 — BATTLE SCREEN
   ========================================================================== */
#battleScreen .battle-toolbar{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  max-width:1400px; margin:0 auto 18px;
}
.battle-toolbar .left-tools, .battle-toolbar .right-tools{display:flex; gap:10px; flex-wrap:wrap;}

.battle-table{
  max-width:1400px; margin:0 auto; background:radial-gradient(ellipse at 50% 0%, var(--bg-700), var(--bg-900));
  border:1px solid var(--line); border-radius:18px; padding:26px; box-shadow:var(--shadow);
}

.battlefield-grid{
  display:grid;
  grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr;
  gap:14px; align-items:end; margin-bottom:22px;
}
.field-slot{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;}
.field-slot .slot-label{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-dim); font-weight:700;}
.field-slot.hero .slot-label{color:var(--gold); font-size:0.78rem;}

.dropzone{
  width:var(--card-w); height:var(--card-h);
  border:2px dashed var(--line); border-radius:var(--radius);
  background:rgba(0,0,0,0.2);
  display:flex; align-items:center; justify-content:center;
  position:relative; transition:border-color .15s, background .15s;
}
.field-slot.hero .dropzone{
  width:calc(var(--card-w) * 1.18); height:calc(var(--card-h) * 1.18);
  border-color:var(--gold-dim); box-shadow:0 0 0 3px rgba(212,175,90,0.08);
}
.dropzone.drag-over{border-color:var(--gold); background:rgba(212,175,90,0.08);}
.dropzone.occupied{border-style:solid;}

.field-card{
  width:100%; height:100%; border-radius:8px; overflow:hidden; position:relative;
  cursor:grab; box-shadow:0 4px 14px rgba(0,0,0,0.55);
}
.field-card img{width:100%; height:100%; object-fit:cover; display:block; background:var(--bg-700);}
.field-card .card-name-tag{
  position:absolute; left:0; right:0; bottom:0; background:linear-gradient(0deg, rgba(0,0,0,0.88), transparent);
  color:var(--parchment); font-size:0.68rem; padding:14px 6px 4px; text-align:center; pointer-events:none;
}

/* Life tracker overlay (top-right) */
.life-tracker{
  position:absolute; top:4px; right:4px; display:flex; align-items:center; gap:4px;
  background:rgba(10,10,10,0.75); border-radius:999px; padding:2px 4px; z-index:3;
}
.life-tracker button{width:18px; height:18px; border-radius:50%; border:none; font-size:0.75rem; font-weight:700; cursor:pointer; line-height:1;}
.life-tracker .life-minus{background:var(--danger); color:#2a0a06;}
.life-tracker .life-plus{background:var(--good); color:#052b14;}
.life-tracker .life-val{color:#fff; font-size:0.68rem; font-weight:700; min-width:26px; text-align:center;}

/* Static attack readout (top-left) */
.attack-badge{
  position:absolute; top:4px; left:4px; background:rgba(10,10,10,0.75); color:var(--gold);
  font-size:0.65rem; font-weight:700; padding:2px 7px; border-radius:999px; z-index:3;
}

/* Affinity/type accent ring on the card art */
.field-card.accent{box-shadow:0 0 0 2px var(--accent-color), 0 4px 14px rgba(0,0,0,0.55);}

.item-badge{
  position:absolute; left:4px; bottom:4px; background:rgba(212,175,90,0.92); color:#241b06;
  font-size:0.65rem; font-weight:700; padding:2px 6px; border-radius:6px; z-index:3;
}

.slot-empty-icon{color:var(--line); font-size:1.6rem;}

.piles-row{display:flex; gap:24px; justify-content:center; margin-bottom:24px; flex-wrap:wrap;}
.pile{display:flex; flex-direction:column; align-items:center; gap:8px;}
.pile-label{font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;}
.pile.deck .pile-label{color:var(--blue-deck);}
.pile.veil .pile-label{color:var(--purple-veil);}

.pile-stack{
  width:var(--card-w); height:var(--card-h); border-radius:var(--radius);
  display:flex; align-items:center; justify-content:center; position:relative;
  cursor:pointer; box-shadow:var(--shadow); user-select:none;
}
.pile.deck .pile-stack{
  background:repeating-linear-gradient(135deg, var(--blue-deck-dim), var(--blue-deck-dim) 10px, #1c3a55 10px, #1c3a55 20px);
  border:2px solid var(--blue-deck); font-weight:700; color:#fff; font-size:1.5rem;
}
.pile.veil .pile-stack{background:var(--bg-900); border:2px dashed var(--purple-veil-dim);}
.pile.veil .pile-stack.has-cards{border-style:solid; border-color:var(--purple-veil);}
.pile.veil .pile-stack img{width:100%; height:100%; object-fit:cover; border-radius:7px;}
.pile-count{position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.7); color:#fff; font-size:0.72rem; font-weight:700; padding:2px 7px; border-radius:999px;}
.pile-hint{font-size:0.68rem; color:var(--ink-dim); max-width:150px; text-align:center;}

.hand-tray{border-top:2px solid var(--gold-dim); margin-top:6px; padding-top:16px;}
.hand-tray-header{display:flex; align-items:center; justify-content:space-between; max-width:1400px; margin:0 auto 8px;}
.hand-tray-header h3{margin:0; font-size:0.9rem; color:var(--parchment);}
.hand-tray-header .lock-note{font-size:0.7rem; color:var(--purple-veil); font-weight:700;}
.hand-strip{
  display:flex; gap:10px; overflow-x:auto; padding:6px 10px 14px; min-height:calc(var(--card-h) + 10px);
  border:2px dashed var(--line); border-radius:var(--radius); background:rgba(0,0,0,0.18);
}
.hand-strip.drag-over{border-color:var(--gold);}
.hand-empty{margin:auto; color:var(--ink-dim); font-size:0.85rem;}

.status-line{max-width:1400px; margin:14px auto 0; font-size:0.78rem; color:var(--ink-dim); text-align:center;}
</style>
</head>
<body>

<!-- ============================================================
     TOP NAVIGATION
     ============================================================ -->
<div id="topbar">
  <div class="brand">
    <div class="crest"></div>
    <h1>D20TCG <span>// Deck Editor &amp; Battle Simulator</span></h1>
  </div>
  <div class="nav-tabs">
    <button id="tabEditor" class="active" onclick="showScreen('editor')">Deck Editor</button>
    <button id="tabBattle" onclick="showScreen('battle')">Battle Screen</button>
  </div>
</div>

<div style="padding:16px 24px 0;">
  <div id="loadBanner"></div>
</div>

<!-- ============================================================
     SCREEN 1 — DECK EDITOR
     ============================================================ -->
<div id="deckEditorScreen" class="screen active">
  <div class="editor-grid">

    <!-- LEFT PANEL: full alphabetical card database, loaded from cards.json -->
    <div class="panel">
      <h2>Card Database <span class="count-pill" id="dbCountPill">0 cards</span></h2>
      <input type="text" id="searchInput" placeholder="Search cards by name…" oninput="renderDatabaseList()">
      <div class="type-filters" id="typeFilters"></div>
      <div class="scroll-list" id="databaseList"></div>
    </div>

    <!-- RIGHT PANEL: the deck currently being assembled -->
    <div class="panel">
      <h2>Active Deck <span class="count-pill" id="deckCountPill">0 / — cards</span></h2>
      <div class="scroll-list" id="deckList"></div>
      <div class="panel-footer">
        <div class="deck-total">Total cards: <b id="deckTotalNum">0</b></div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-outline" onclick="clearDeck()">Clear Deck</button>
          <button class="btn btn-gold" onclick="exportDeckJSON()">⬇ Export Deck (JSON)</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ============================================================
     SCREEN 2 — BATTLE SCREEN
     ============================================================ -->
<div id="battleScreen" class="screen">

  <div class="battle-toolbar">
    <div class="left-tools">
      <button class="btn btn-gold" onclick="loadDeckIntoBattle()">↺ Load Deck From Editor</button>
      <button class="btn btn-outline" onclick="drawCard()">Draw Card</button>
    </div>
    <div class="right-tools">
      <button class="btn btn-purple" id="popoutBtn" onclick="openPopout()">🎥 Open Streaming Pop-out Window</button>
    </div>
  </div>

  <div class="battle-table">
    <div class="battlefield-grid" id="battlefieldGrid"></div>

    <div class="piles-row">
      <div class="pile deck">
        <div class="pile-label">Main Deck</div>
        <div class="pile-stack" id="mainDeckPile" onclick="drawCard()" title="Click to draw a card"></div>
        <div class="pile-hint">Click pile to draw</div>
        <button class="btn btn-blue" onclick="shuffleDeck()">🔀 Shuffle</button>
      </div>
      <div class="pile veil" id="veilDropzone">
        <div class="pile-label">The Veil</div>
        <div class="pile-stack" id="veilPile"></div>
        <div class="pile-hint">Discard pile — drag cards here</div>
      </div>
    </div>
  </div>

  <div class="hand-tray">
    <div class="hand-tray-header">
      <h3>Your Hand (Private)</h3>
      <span class="lock-note">🔒 hidden from pop-out</span>
    </div>
    <div class="hand-strip" id="handStrip"></div>
  </div>

  <div class="status-line" id="battleStatus">Load a deck from the editor to begin.</div>
</div>

<script>
/* ============================================================================
   1. CARD DATABASE — LOADED FROM cards/cards.json
   ----------------------------------------------------------------------------
   Expected local folder layout (matches your Desktop\D20TCG project):

     D20TCG/
       index.html          <-- this file
       cards/
         cards.json         <-- card data (name, type, stats, image_path)
         Street_Kid,_Grant_frame.png
         Oni-Maru_frame.png
         ...

   Every card entry's "image_path" is already written relative to index.html
   (e.g. "cards/Oni-Maru_frame.png"), so we use it as-is for <img src="">.

   ⚠ IMPORTANT — LOCAL FILE (file://) CORS NOTE:
   Chrome and Edge block fetch()/XHR requests to local files when you just
   double-click index.html and open it as a file:// URL — this is a browser
   security restriction, not a bug in this app. If the banner below reports
   a load failure, do ONE of the following:
     1. Run a tiny local server from the D20TCG folder and open it via
        http://localhost instead, e.g. in a terminal:
           cd C:\Users\tgdos\Desktop\D20TCG
           python -m http.server 8000
        then visit http://localhost:8000/index.html
     2. Or open index.html in Firefox, which allows local fetch() by default.
   ============================================================================ */
const CARDS_JSON_PATH = 'cards/cards.json';

const CARD_TYPES = ['Hero', 'Support', 'Skill', 'Item'];
const AFFINITY_KEYS = ['FIRE', 'WATER', 'EARTH', 'AIR', 'AETHER', 'VOID'];

let CARD_DATABASE = [];       // populated by loadCardDatabase()
let activeTypeFilter = 'All'; // deck-editor left panel filter

function affinityClass(affinity){
  return affinity ? affinity.toLowerCase() : '';
}

function accentColorFor(card){
  if(card.affinity) return 'var(--aff-' + affinityClass(card.affinity) + ')';
  const t = (card.card_type || '').toLowerCase();
  return 'var(--type-' + t + ')';
}

function showLoadBanner(kind, html){
  const el = document.getElementById('loadBanner');
  el.className = kind; // 'info' or 'error'
  el.innerHTML = html;
}
function clearLoadBanner(){
  const el = document.getElementById('loadBanner');
  el.className = '';
  el.innerHTML = '';
}

/* Fetches cards/cards.json and populates CARD_DATABASE, alphabetically sorted. */
async function loadCardDatabase(){
  showLoadBanner('info', 'Loading card database from <code>' + CARDS_JSON_PATH + '</code>…');
  try{
    const res = await fetch(CARDS_JSON_PATH, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error('cards.json must contain a JSON array');

    CARD_DATABASE = data
      .map((c, i) => ({
        dbId: 'db-' + i,
        name: c.name || ('Unnamed Card ' + i),
        card_type: c.card_type || 'Item',
        mach: c.mach,
        affinity: c.affinity,
        species: c.species,
        class: c.class,
        attack: c.attack,
        life: c.life,
        image_path: c.image_path
      }))
      .sort((a, b) => a.name.localeCompare(b.name));

    clearLoadBanner();
    renderTypeFilters();
    renderDeckEditor();
  }catch(err){
    console.error(err);
    showLoadBanner('error',
      '<b>Could not load ' + CARDS_JSON_PATH + '.</b> (' + err.message + ')<br>' +
      'If you opened this file directly (file:// in Chrome/Edge), local fetch is blocked by the browser. ' +
      'Serve the folder with <code>python -m http.server</code> and open it via <code>http://localhost</code>, ' +
      'or open this page in Firefox instead. Also double-check that <code>cards/cards.json</code> ' +
      'sits next to this index.html and is valid JSON.');
  }
}


/* ============================================================================
   2. APPLICATION STATE
   ============================================================================ */
// Deck being assembled in the editor: { cardName: quantity }
let deckState = {};

let battle = {
  mainDeck: [],
  hand: [],
  veil: [],
  field: { ls2: null, ls1: null, hero: null, rs1: null, rs2: null }
};

let instanceCounter = 0;
function newInstanceId(){ instanceCounter += 1; return 'inst-' + instanceCounter + '-' + Date.now(); }

let popoutWin = null;


/* ============================================================================
   3. SCREEN NAVIGATION
   ============================================================================ */
function showScreen(which){
  document.getElementById('deckEditorScreen').classList.toggle('active', which === 'editor');
  document.getElementById('battleScreen').classList.toggle('active', which === 'battle');
  document.getElementById('tabEditor').classList.toggle('active', which === 'editor');
  document.getElementById('tabBattle').classList.toggle('active', which === 'battle');
}


/* ============================================================================
   4. DECK EDITOR — LEFT PANEL (searchable, type-filterable database)
   ============================================================================ */
function renderTypeFilters(){
  const wrap = document.getElementById('typeFilters');
  const options = ['All', ...CARD_TYPES];
  wrap.innerHTML = options.map(t =>
    `<button class="${t === activeTypeFilter ? 'active' : ''}" onclick="setTypeFilter('${t}')">${t}</button>`
  ).join('');
}
function setTypeFilter(t){
  activeTypeFilter = t;
  renderTypeFilters();
  renderDatabaseList();
}

/* Builds the small meta line under a card's name: species/class + affinity dot,
   or ATK/LFE stats, depending on what the card actually has. Skill/Item cards
   simply omit whatever fields they don't carry. */
function cardMetaHTML(card){
  const bits = [];
  if(card.species || card.class){
    bits.push(`<div class="sub-line">${[card.species, card.class].filter(Boolean).join(' / ')}</div>`);
  }
  if(typeof card.attack === 'number' || typeof card.life === 'number'){
    const parts = [];
    if(typeof card.attack === 'number') parts.push('ATK ' + card.attack);
    if(typeof card.life === 'number') parts.push('LFE ' + card.life);
    if(typeof card.mach === 'number') parts.push('Mach ' + card.mach);
    bits.push(`<div class="stat-line">${parts.join(' · ')}</div>`);
  }
  return bits.join('');
}

function renderDatabaseList(){
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('databaseList');

  document.getElementById('dbCountPill').textContent = CARD_DATABASE.length + ' cards';

  const filtered = CARD_DATABASE.filter(c =>
    c.name.toLowerCase().includes(term) &&
    (activeTypeFilter === 'All' || c.card_type === activeTypeFilter)
  );

  if(CARD_DATABASE.length === 0){
    list.innerHTML = '<div class="empty-hint">No cards loaded yet.</div>';
    return;
  }
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty-hint">No cards match your search/filter.</div>';
    return;
  }

  list.innerHTML = filtered.map(card => {
    const qty = deckState[card.name] || 0;
    const maxed = qty >= 4;
    const dot = card.affinity ? `<span class="affinity-dot ${affinityClass(card.affinity)}"></span>` : '';
    return `
      <div class="db-row">
        <img class="thumb-sm" src="${card.image_path}" alt="${card.name}"
             style="border-color:${accentColorFor(card)}" onerror="this.style.opacity=0.15;">
        <div class="meta">
          <div class="name-row">
            <span class="type-badge ${card.card_type.toLowerCase()}">${card.card_type}</span>
            ${dot}
            <span class="name">${card.name}</span>
          </div>
          ${cardMetaHTML(card)}
        </div>
        <span class="qty-badge">${qty}/4</span>
        <button class="add-btn" ${maxed ? 'disabled' : ''} onclick="addToDeck('${card.name.replace(/'/g, "\\'")}')" title="Add to deck">+</button>
      </div>`;
  }).join('');
}

/* ----------------------------------------------------------------------------
   4b. DECK EDITOR — RIGHT PANEL (active deck + quantity steppers)
   ---------------------------------------------------------------------------- */
function findCardByName(name){
  return CARD_DATABASE.find(c => c.name === name);
}

function addToDeck(name){
  const current = deckState[name] || 0;
  if(current >= 4) return;
  deckState[name] = current + 1;
  renderDeckEditor();
}

function setQty(name, qty){
  qty = Math.max(0, Math.min(4, qty));
  if(qty === 0){ delete deckState[name]; }
  else { deckState[name] = qty; }
  renderDeckEditor();
}

function clearDeck(){
  if(Object.keys(deckState).length === 0) return;
  if(!confirm('Clear the entire active deck?')) return;
  deckState = {};
  renderDeckEditor();
}

function renderDeckEditor(){
  renderDatabaseList();

  const deckList = document.getElementById('deckList');
  const entries = Object.keys(deckState)
    .filter(name => deckState[name] > 0)
    .map(name => ({ card: findCardByName(name), qty: deckState[name] }))
    .filter(e => e.card)
    .sort((a, b) => a.card.name.localeCompare(b.card.name));

  const total = entries.reduce((sum, e) => sum + e.qty, 0);
  document.getElementById('deckCountPill').textContent = entries.length + ' unique / ' + total + ' cards';
  document.getElementById('deckTotalNum').textContent = total;

  if(entries.length === 0){
    deckList.innerHTML = '<div class="empty-hint">Your deck is empty. Add cards from the database on the left.</div>';
    return;
  }

  deckList.innerHTML = entries.map(({card, qty}) => {
    const dot = card.affinity ? `<span class="affinity-dot ${affinityClass(card.affinity)}"></span>` : '';
    return `
    <div class="deck-row">
      <img class="thumb-sm" src="${card.image_path}" alt="${card.name}"
           style="border-color:${accentColorFor(card)}" onerror="this.style.opacity=0.15;">
      <div class="meta" style="flex:1;">
        <div class="name-row">
          <span class="type-badge ${card.card_type.toLowerCase()}">${card.card_type}</span>
          ${dot}
          <span class="name">${card.name}</span>
        </div>
        ${cardMetaHTML(card)}
      </div>
      <div class="stepper">
        <button onclick="setQty('${card.name.replace(/'/g, "\\'")}', ${qty - 1})">−</button>
        <span class="qty-num">${qty}</span>
        <button ${qty >= 4 ? 'disabled' : ''} onclick="setQty('${card.name.replace(/'/g, "\\'")}', ${qty + 1})">+</button>
      </div>
    </div>`;
  }).join('');
}

/* ----------------------------------------------------------------------------
   4c. EXPORT DECK AS A DOWNLOADED JSON FILE
   ---------------------------------------------------------------------------- */
function exportDeckJSON(){
  const entries = Object.keys(deckState)
    .filter(name => deckState[name] > 0)
    .map(name => {
      const card = findCardByName(name);
      return {
        name,
        card_type: card ? card.card_type : null,
        image_path: card ? card.image_path : null,
        quantity: deckState[name]
      };
    });

  if(entries.length === 0){
    alert('Add at least one card to the deck before exporting.');
    return;
  }

  const payload = { deckName: 'My D20TCG Deck', exportedAt: new Date().toISOString(), cards: entries };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'deck-export.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}


/* ============================================================================
   5. BATTLE SCREEN SETUP
   ============================================================================ */
function loadDeckIntoBattle(){
  const names = [];
  Object.keys(deckState).forEach(name => {
    for(let i = 0; i < deckState[name]; i++) names.push(name);
  });

  if(names.length === 0){
    alert('Your active deck is empty — add cards in the Deck Editor first.');
    return;
  }

  battle.mainDeck = names.map(name => makeCardInstance(findCardByName(name))).filter(Boolean);
  battle.hand = [];
  battle.veil = [];
  battle.field = { ls2: null, ls1: null, hero: null, rs1: null, rs2: null };

  shuffleArray(battle.mainDeck);
  document.getElementById('battleStatus').textContent = 'Deck loaded: ' + battle.mainDeck.length + ' cards shuffled into the Main Deck.';
  renderBattle();
  syncPopout();
}

/* A "live" battle-ready copy of a database card: carries all its static
   data, plus per-instance mutable state (current life, attached items). */
function makeCardInstance(dbCard){
  if(!dbCard) return null;
  return {
    instanceId: newInstanceId(),
    name: dbCard.name,
    card_type: dbCard.card_type,
    affinity: dbCard.affinity,
    species: dbCard.species,
    class: dbCard.class,
    attack: dbCard.attack,
    maxLife: dbCard.life,
    life: dbCard.life,     // current life — ticks down via the life tracker
    mach: dbCard.mach,
    image_path: dbCard.image_path,
    items: []
  };
}

function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function shuffleDeck(){
  if(battle.mainDeck.length === 0) return;
  shuffleArray(battle.mainDeck);
  document.getElementById('battleStatus').textContent = 'Main Deck shuffled (' + battle.mainDeck.length + ' cards).';
  renderBattle();
  syncPopout();
}

function drawCard(){
  if(battle.mainDeck.length === 0){
    document.getElementById('battleStatus').textContent = 'The Main Deck is empty — nothing left to draw.';
    return;
  }
  const card = battle.mainDeck.pop();
  battle.hand.push(card);
  document.getElementById('battleStatus').textContent = 'Drew "' + card.name + '" into your hand.';
  renderBattle();
  syncPopout();
}


/* ============================================================================
   6. DRAG-AND-DROP ENGINE
   ============================================================================ */
function onCardDragStart(e, source, slotKey){
  const payload = { source, slotKey: slotKey || null };
  e.dataTransfer.setData('text/plain', JSON.stringify(payload));
  e.dataTransfer.effectAllowed = 'move';
}
function readDragPayload(e){
  try{ return JSON.parse(e.dataTransfer.getData('text/plain')); }
  catch(err){ return null; }
}
function pluckCardFromSource(payload){
  if(!payload) return null;
  if(payload.source === 'hand'){
    const idx = battle.hand.findIndex(c => c.instanceId === payload.instanceId);
    if(idx === -1) return null;
    return battle.hand.splice(idx, 1)[0];
  }
  if(payload.source === 'field'){
    const card = battle.field[payload.slotKey];
    battle.field[payload.slotKey] = null;
    return card;
  }
  if(payload.source === 'veil'){
    const idx = battle.veil.findIndex(c => c.instanceId === payload.instanceId);
    if(idx === -1) return null;
    return battle.veil.splice(idx, 1)[0];
  }
  return null;
}

function onFieldSlotDrop(e, slotKey){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const payloadRaw = e.dataTransfer.getData('text/plain');
  if(!payloadRaw) return;
  const payload = JSON.parse(payloadRaw);
  if(payload.source === 'field' && payload.slotKey === slotKey) return;

  const card = pluckCardFromSource(payload);
  if(!card) { renderBattle(); return; }

  const existing = battle.field[slotKey];
  if(existing && existing.instanceId !== card.instanceId){
    existing.items.push(card);
    document.getElementById('battleStatus').textContent = '"' + card.name + '" attached to "' + existing.name + '" as an item.';
  } else {
    battle.field[slotKey] = card;
    document.getElementById('battleStatus').textContent = '"' + card.name + '" moved to the field.';
  }
  renderBattle();
  syncPopout();
}

function onHandDrop(e){
  e.preventDefault();
  document.getElementById('handStrip').classList.remove('drag-over');
  const payload = readDragPayload(e);
  const card = pluckCardFromSource(payload);
  if(!card) { renderBattle(); return; }
  battle.hand.push(card);
  renderBattle();
  syncPopout();
}

function onVeilDrop(e){
  e.preventDefault();
  document.getElementById('veilDropzone').classList.remove('drag-over');
  const payload = readDragPayload(e);
  const card = pluckCardFromSource(payload);
  if(!card) { renderBattle(); return; }
  battle.veil.push(card);
  document.getElementById('battleStatus').textContent = '"' + card.name + '" sent to The Veil.';
  renderBattle();
  syncPopout();
}

function onVeilDragStart(e){
  if(battle.veil.length === 0){ e.preventDefault(); return; }
  const top = battle.veil[battle.veil.length - 1];
  e.dataTransfer.setData('text/plain', JSON.stringify({ source: 'veil', instanceId: top.instanceId }));
  e.dataTransfer.effectAllowed = 'move';
}


/* ============================================================================
   7. LIFE TRACKER (Hero / Support cards only — Skill/Item have no life stat)
   ============================================================================ */
function adjustLife(slotKey, delta){
  const card = battle.field[slotKey];
  if(!card || typeof card.life !== 'number') return;
  card.life += delta;
  renderBattle();
  syncPopout();
}


/* ============================================================================
   8. BATTLE SCREEN RENDERING
   ============================================================================ */
const FIELD_SLOTS = [
  { key: 'ls2',  label: 'Left Support 2',  hero: false },
  { key: 'ls1',  label: 'Left Support 1',  hero: false },
  { key: 'hero', label: 'Hero Zone',       hero: true  },
  { key: 'rs1',  label: 'Right Support 1', hero: false },
  { key: 'rs2',  label: 'Right Support 2', hero: false }
];

function fieldCardHTML(card, slotKey){
  const hasLife = typeof card.life === 'number';
  const hasAttack = typeof card.attack === 'number';
  const lifeTracker = hasLife ? `
      <div class="life-tracker">
        <button class="life-minus" onclick="event.stopPropagation(); adjustLife('${slotKey}', -1)">−</button>
        <span class="life-val">${card.life}${typeof card.maxLife === 'number' ? '/' + card.maxLife : ''}</span>
        <button class="life-plus" onclick="event.stopPropagation(); adjustLife('${slotKey}', 1)">+</button>
      </div>` : '';
  const attackBadge = hasAttack ? `<div class="attack-badge">ATK ${card.attack}</div>` : '';
  const itemsBadge = card.items.length
    ? `<div class="item-badge" title="${card.items.map(i=>i.name).join(', ')}">+${card.items.length} item${card.items.length>1?'s':''}</div>`
    : '';
  return `
    <div class="field-card accent" style="--accent-color:${accentColorFor(card)}"
         draggable="true"
         ondragstart="onCardDragStart(event,'field','${slotKey}')">
      <img src="${card.image_path}" alt="${card.name}" onerror="this.style.opacity=0.15;">
      ${lifeTracker}
      ${attackBadge}
      ${itemsBadge}
      <div class="card-name-tag">${card.name}</div>
    </div>`;
}

function renderBattlefieldGrid(){
  const grid = document.getElementById('battlefieldGrid');
  grid.innerHTML = FIELD_SLOTS.map(slot => {
    const card = battle.field[slot.key];
    const inner = card ? fieldCardHTML(card, slot.key) : '<span class="slot-empty-icon">✚</span>';
    return `
      <div class="field-slot ${slot.hero ? 'hero' : ''}">
        <div class="slot-label">${slot.label}</div>
        <div class="dropzone ${card ? 'occupied' : ''}"
             data-slot="${slot.key}"
             ondragover="event.preventDefault(); event.currentTarget.classList.add('drag-over');"
             ondragleave="event.currentTarget.classList.remove('drag-over');"
             ondrop="onFieldSlotDrop(event,'${slot.key}')">
          ${inner}
        </div>
      </div>`;
  }).join('');
}

function renderPiles(){
  const deckPile = document.getElementById('mainDeckPile');
  deckPile.innerHTML = battle.mainDeck.length
    ? `<span style="color:var(--blue-deck); font-weight:700;">${battle.mainDeck.length}</span><span class="pile-count">MAIN</span>`
    : `<span class="slot-empty-icon">Ø</span>`;

  const veilPile = document.getElementById('veilPile');
  if(battle.veil.length === 0){
    veilPile.innerHTML = `<span class="slot-empty-icon">✚</span>`;
    veilPile.classList.remove('has-cards');
  } else {
    const top = battle.veil[battle.veil.length - 1];
    veilPile.classList.add('has-cards');
    veilPile.innerHTML = `
      <img src="${top.image_path}" alt="${top.name}"
           draggable="true"
           ondragstart="onVeilDragStart(event)"
           onerror="this.style.opacity=0.15;">
      <span class="pile-count">${battle.veil.length}</span>`;
  }
}

function renderHand(){
  const strip = document.getElementById('handStrip');
  if(battle.hand.length === 0){
    strip.innerHTML = '<div class="hand-empty">Your hand is empty. Draw from the Main Deck.</div>';
    return;
  }
  strip.innerHTML = battle.hand.map(card => `
    <div class="field-card accent" style="flex-shrink:0; --accent-color:${accentColorFor(card)}"
         draggable="true"
         ondragstart="event.dataTransfer.setData('text/plain', JSON.stringify({source:'hand', instanceId:'${card.instanceId}'})); event.dataTransfer.effectAllowed='move';">
      <img src="${card.image_path}" alt="${card.name}" onerror="this.style.opacity=0.15;">
      <div class="card-name-tag">${card.name}</div>
    </div>`).join('');
}

function renderBattle(){
  renderBattlefieldGrid();
  renderPiles();
  renderHand();
}

function wireStaticDropzones(){
  const handStrip = document.getElementById('handStrip');
  handStrip.addEventListener('dragover', e => { e.preventDefault(); handStrip.classList.add('drag-over'); });
  handStrip.addEventListener('dragleave', () => handStrip.classList.remove('drag-over'));
  handStrip.addEventListener('drop', onHandDrop);

  const veilZone = document.getElementById('veilDropzone');
  veilZone.addEventListener('dragover', e => { e.preventDefault(); veilZone.classList.add('drag-over'); });
  veilZone.addEventListener('dragleave', () => veilZone.classList.remove('drag-over'));
  veilZone.addEventListener('drop', onVeilDrop);
}

<body>
  <h2>🎥 Live Battle Stream</h2>
  <div class="grid" id="grid"></div>
  <div class="piles">
    <div class="pile deck"><div class="pile-label">Main Deck</div><div class="stack" id="deckStack"></div></div>
    <div class="pile veil"><div class="pile-label">The Veil</div><div class="stack" id="veilStack"></div></div>
  </div>
  <div class="status">Mirroring the host window's board in real time. The host's private hand is intentionally never transmitted here.</div>
<script>
  // NOTE: there is deliberately no hand-related markup or state anywhere in
  // this document — the "sync" payload never contains it, by design.
  var SLOTS = [
    {key:'ls2', label:'Left Support 2', hero:false},
    {key:'ls1', label:'Left Support 1', hero:false},
    {key:'hero', label:'Hero Zone', hero:true},
    {key:'rs1', label:'Right Support 1', hero:false},
    {key:'rs2', label:'Right Support 2', hero:false}
  ];

  function accentColorFor(card){
    if(card.affinity) return 'var(--aff-' + card.affinity.toLowerCase() + ')';
    var t = (card.card_type || '').toLowerCase();
    return 'var(--type-' + t + ')';
  }

  function render(data){
    var grid = document.getElementById('grid');
    grid.innerHTML = SLOTS.map(function(slot){
      var card = data.field ? data.field[slot.key] : null;
      var inner = '<span class="empty">&#10022;</span>';
      if(card){
        var itemsBadge = (card.items && card.items.length)
          ? '<div class="item-badge">+' + card.items.length + ' item' + (card.items.length>1?'s':'') + '</div>'
          : '';
        var lifeTag = (typeof card.life === 'number')
          ? '<div class="life">' + card.life + (typeof card.maxLife === 'number' ? '/' + card.maxLife : '') + '</div>'
          : '';
        var atkTag = (typeof card.attack === 'number')
          ? '<div class="atk">ATK ' + card.attack + '</div>'
          : '';
        inner = '<img src="' + card.image_path + '" alt="' + card.name + '" style="box-shadow:inset 0 0 0 2px ' + accentColorFor(card) + '">' +
                lifeTag + atkTag + itemsBadge +
                '<div class="tag">' + card.name + '</div>';
      }
      return '<div class="slot ' + (slot.hero ? 'hero' : '') + '">' +
             '<div class="label">' + slot.label + '</div>' +
             '<div class="box">' + inner + '</div></div>';
    }).join('');

    var deckStack = document.getElementById('deckStack');
    deckStack.textContent = data.mainDeckCount != null ? data.mainDeckCount : '0';

    var veilStack = document.getElementById('veilStack');
    if(data.veilTop){
      veilStack.className = 'stack has';
      veilStack.innerHTML = '<img src="' + data.veilTop.image_path + '" alt="' + data.veilTop.name + '">' +
                             '<div class="count">' + data.veilCount + '</div>';
    } else {
      veilStack.className = 'stack';
      veilStack.innerHTML = '<span class="empty">&#10022;</span>';
    }
  }

  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'tcg-sync'){ render(e.data); }
  });

  if(window.opener){ window.opener.postMessage({ type: 'tcg-popout-ready' }, '*'); }
<\/script>
</body>
</html>`;

function openPopout(){
  popoutWin = window.open('', 'tcgBattleStream', 'width=980,height=680');
  if(!popoutWin){
    alert('Your browser blocked the pop-out. Please allow pop-ups for this page and try again.');
    return;
  }
  popoutWin.document.open();
  popoutWin.document.write(POPOUT_DOCUMENT_HTML);
  popoutWin.document.close();
  document.getElementById('battleStatus').textContent = 'Streaming pop-out window opened — your hand stays private.';
}

function syncPopout(){
  if(!popoutWin || popoutWin.closed) { popoutWin = null; return; }
  const payload = {
    type: 'tcg-sync',
    field: battle.field,
    mainDeckCount: battle.mainDeck.length,
    veilTop: battle.veil.length ? battle.veil[battle.veil.length - 1] : null,
    veilCount: battle.veil.length
    // battle.hand is intentionally NEVER included here.
  };
  popoutWin.postMessage(payload, '*');
}

window.addEventListener('message', e => {
  if(e.data && e.data.type === 'tcg-popout-ready'){ syncPopout(); }
});


/* ============================================================================
   10. INITIALIZATION
   ============================================================================ */
async function init(){
  renderBattle();
  wireStaticDropzones();
  await loadCardDatabase(); // async: renders the deck editor once cards.json resolves
}
init();
</script>
</body>
</html>
